<title>REALTURN</title>

<style>
  :root {
    --ink: #0C1C30;
    --deep: #06101D;
    --ice: #8CCBF2;
    --mist: #CFE8F8;
    --fade: rgba(207, 232, 248, 0.55);
    --lift: 24px;
    --drop: 200px;
    --ease: cubic-bezier(.2,.8,.2,1);
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--deep);
    color: var(--mist);
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }

  /* ---------- Sidan (två halvor) ---------- */
  .half {
    position: fixed; inset: 0;
    z-index: 2;
    pointer-events: none;
    transition: transform 1s var(--ease), filter 1s var(--ease);
  }
  .clip { position: absolute; inset: 0; pointer-events: auto; }
  /* Snittet går precis under logotypen (--cut sätts av skriptet) */
  .js .left  .clip { clip-path: inset(0 0 calc(100% - var(--cut, 45%)) 0); }
  .js .right .clip { clip-path: inset(var(--cut, 45%) 0 0 0); }
  .open .half { filter: drop-shadow(0 24px 40px rgba(0, 0, 0, .75)); }
  .open .left  { transform: translateY(calc(var(--lift) * -1)); }
  .open .right { transform: translateY(var(--drop)); filter: drop-shadow(0 -24px 40px rgba(0, 0, 0, .75)); }

    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  main {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem;
  }
  .logo-btn {
    background: none; border: 0; padding: 0; cursor: pointer;
    margin-bottom: clamp(1.75rem, 5vh, 3rem);
    border-radius: 12px;
  }
  .logo-btn:focus-visible { outline: 2px solid var(--ice); outline-offset: 10px; }
  .logo {
    display: block;
    width: min(44vw, 240px); height: auto;
    fill: var(--ice);
    overflow: visible;
    filter: drop-shadow(0 0 40px rgba(140, 203, 242, 0.25));
    transform-origin: 50% 40%;
    animation: turn 1.6s var(--ease) both;
    transition: filter .4s ease;
  }
  .logo-btn:hover .logo { filter: drop-shadow(0 0 55px rgba(140, 203, 242, 0.5)); }

  .laser polygon {
    fill: none;
    stroke: #EAF6FD;
    stroke-width: 5;
    stroke-linejoin: round;
    stroke-linecap: round;
    stroke-dasharray: 9 91;
    opacity: .85;
    animation: laser 4.5s 1.4s linear infinite both;
  }
  .laser polygon:nth-child(2) { animation-delay: 1.9s; }
  .laser polygon:nth-child(3) { animation-duration: 3.2s; stroke-dasharray: 12 88; opacity: .6; }
  @keyframes laser { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }

  .title {
    width: min(86vw, 600px);
    line-height: 1;
    animation: settle 1.4s .5s var(--ease) both;
  }
  .title-svg { display: block; width: 100%; height: auto; overflow: visible; }
  .title-svg .t {
    font-family: "Unbounded", "Helvetica Neue", Arial, sans-serif;
    font-weight: 600;
    font-size: 112px;
  }
  .title-svg .t-laser {
    fill: none;
    stroke: #FFFFFF;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 34 514;
    opacity: 0;
    animation: tlaser 2.4s 1.8s linear 3, tfade 7.2s 1.8s ease-in-out forwards;
  }
  @keyframes tlaser { from { stroke-dashoffset: 548; } to { stroke-dashoffset: 0; } }
  @keyframes tfade {
    0%   { opacity: 0; }
    8%   { opacity: .95; }
    80%  { opacity: .95; }
    100% { opacity: 0; }
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  .quote {
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: clamp(1.2rem, 3.6vw, 1.75rem);
    color: var(--fade);
    margin-top: 1.25rem;
    line-height: 1.4;
    max-width: 30ch;
    animation: appear 1s 1.1s ease both;
  }

  /* ---------- Knappar ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: .75rem;
    padding: .9rem 1.6rem .9rem 1.2rem;
    border: 1px solid rgba(140, 203, 242, .55);
    border-radius: 999px;
    color: #EAF6FD;
    text-decoration: none;
    font-size: .8rem; font-weight: 500;
    letter-spacing: .06em;
    background: rgba(140, 203, 242, .06);
    backdrop-filter: blur(6px);
    transition: background .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .pill:hover { background: rgba(140, 203, 242, .16); border-color: var(--ice); box-shadow: 0 0 30px rgba(140, 203, 242, .25); }
  .pill:focus-visible { outline: 2px solid var(--ice); outline-offset: 4px; }
  .pill svg { width: 1.35rem; height: 1.35rem; flex: none; }
  .spotify { margin-top: 2.25rem; animation: spin-in 1.3s 1.7s var(--ease) both; }

  footer {
    text-align: center;
    padding: 1.25rem;
    font-size: 0.7rem; font-weight: 300;
    letter-spacing: 0.08em;
    color: rgba(207, 232, 248, 0.35);
  }

  /* ---------- Det som syns i splitten ---------- */
  .reveal {
    position: fixed; inset: 0; z-index: 1;
    background: #0B0F17;
    overflow: hidden;
  }
  .glass {
    position: absolute; left: 50%;
    top: calc(var(--cut, 45%) + (var(--drop) - var(--lift)) / 2);
    translate: -50% -50%;
    opacity: 0;
  }
  .glass .pill { white-space: nowrap; background: rgba(140, 203, 242, .08); }
  .open .glass { animation: bounce .9s .45s both; }
  @keyframes bounce {
    0%   { opacity: 0; transform: translateY(40px) scale(.6); animation-timing-function: cubic-bezier(.2,.8,.3,1); }
    55%  { opacity: 1; transform: translateY(-10px) scale(1.05); animation-timing-function: ease-in-out; }
    78%  { transform: translateY(3px) scale(.98); }
    100% { opacity: 1; transform: none; }
  }

  /* ---------- Animationer ---------- */
  @keyframes turn   { from { opacity: 0; transform: rotate(-120deg) scale(.7); } to { opacity: 1; transform: none; } }
  @keyframes spin-in{ from { opacity: 0; transform: rotate(-180deg) scale(.5); } to { opacity: 1; transform: none; } }
  @keyframes settle { from { opacity: 0; transform: scaleX(1.25); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .logo, .title, .quote, .spotify, .laser polygon, .t-laser { animation: none; }
    .laser, .t-laser { display: none; }
    .half { transition: none; }
    .open .glass { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>

<script>
(function () {
  try {
    var root = document.documentElement;
    var left = document.querySelector('.half.left');
    var right = left.cloneNode(true);
    right.classList.remove('left');
    right.classList.add('right');
    right.setAttribute('aria-hidden', 'true');
    right.querySelectorAll('a, button').forEach(function (el) { el.setAttribute('tabindex', '-1'); });
    left.after(right);
    root.classList.add('js');
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelectorAll('svg.logo, svg.title-svg').forEach(function (sv) { if (sv.pauseAnimations) sv.pauseAnimations(); });
    }

    var insta = document.querySelector('.reveal .pill');
    var mainBtn = left.querySelector('.logo-btn');

    function setCut() {
      var r = mainBtn.getBoundingClientRect();
      var gap = parseFloat(getComputedStyle(mainBtn).marginBottom) || 32;
      root.style.setProperty('--cut', Math.round(r.bottom + gap / 2) + 'px');
    }
    setCut();
    window.addEventListener('resize', setCut);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(setCut);

    function setOpen(open) {
      document.body.classList.toggle('open', open);
      mainBtn.setAttribute('aria-expanded', String(open));
      mainBtn.setAttribute('aria-label', open ? 'Stäng' : 'Öppna sociala medier');
      insta.setAttribute('tabindex', open ? '0' : '-1');
      if (open) setTimeout(function () { insta.focus({ preventScroll: true }); }, 600);
    }
    function toggle() { setOpen(!document.body.classList.contains('open')); }

    document.querySelectorAll('.logo-btn').forEach(function (b) { b.addEventListener('click', toggle); });
    document.getElementById('reveal').addEventListener('click', function (e) {
      if (e.target === this) setOpen(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { setOpen(false); mainBtn.focus(); }
    });

    var y = new Date().getFullYear();
    document.querySelectorAll('.year').forEach(function (s) { s.textContent = y; });
  } catch (e) {}
})();
</script>
